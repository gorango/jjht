<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EUREKA — run trace</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12161b;
    --line: #232a33;
    --text: #dfe6ee;
    --dim: #8b98a8;
    --accent: #7cc4ff;
    --ok: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--mono);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(11,13,16,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px;
  }
  .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  select, input {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit;
  }
  input { min-width: 240px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    padding: 3px 9px; border-radius: 999px; cursor: pointer; user-select: none;
  }
  .chip.on { color: var(--text); border-color: var(--accent); }
  .stat { color: var(--dim); }
  .stat b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 96px); }
  #timeline { padding: 10px 12px 60px; overflow-x: hidden; }
  .row {
    display: grid; grid-template-columns: 66px 120px 170px 1fr; gap: 10px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; align-items: baseline;
    border: 1px solid transparent;
  }
  .row:hover { background: var(--panel); border-color: var(--line); }
  .t { color: var(--dim); text-align: right; }
  .actor { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary { color: var(--text); overflow-wrap: anywhere; }
  .row.reject .summary { color: var(--bad); }
  .row.approve .summary { color: var(--ok); }
  .row.measure .summary { color: var(--warn); }
  pre.json {
    grid-column: 1 / -1; margin: 6px 0 2px; padding: 10px; background: #0e1218;
    border: 1px solid var(--line); border-radius: 6px; color: var(--dim);
    max-height: 420px; overflow: auto; white-space: pre-wrap;
  }
  aside { border-left: 1px solid var(--line); padding: 18px 20px 60px; overflow: auto; max-height: calc(100vh - 96px); }
  aside h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
  .md h1, .md h2, .md h3 { font-size: 13px; margin: 18px 0 6px; color: var(--text); }
  .md h1 { font-size: 15px; color: var(--accent); }
  .md p { margin: 6px 0; color: var(--text); }
  .md li { color: var(--text); }
  .md a { color: var(--accent); }
  .md code { color: var(--warn); }
  .empty { color: var(--dim); padding: 20px 0; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span>EUREKA</span> trace</h1>
    <select id="run"></select>
    <input id="search" placeholder="filter: critic, R0001, reject…" />
    <span class="stat">elapsed <b id="s-time">–</b></span>
    <span class="stat">calls <b id="s-calls">–</b></span>
    <span class="stat">tokens <b id="s-tokens">–</b></span>
    <span class="stat">cost <b id="s-cost">–</b></span>
    <span class="stat">approved <b id="s-approved">–</b></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <section id="timeline"></section>
  <aside>
    <h2>Portfolio</h2>
    <div id="portfolio" class="md empty">loading…</div>
  </aside>
</main>
<script>
const qs = new URLSearchParams(location.search);
const runSelect = document.getElementById('run');
const timeline = document.getElementById('timeline');
const chips = document.getElementById('chips');
const search = document.getElementById('search');

let lines = [];
let active = new Set();
let runId = qs.get('run');

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot() {
  const runs = await (await fetch('/runs.json')).json();
  if (!runId) runId = runs[0];
  runSelect.innerHTML = runs.map((r) => `<option ${r === runId ? 'selected' : ''}>${esc(r)}</option>`).join('');
  runSelect.onchange = () => { location.search = `?run=${encodeURIComponent(runSelect.value)}`; };
  await load(runId);
}

async function load(id) {
  const res = await fetch(`/run/${id}/trace.jsonl`, { cache: 'no-store' });
  const text = await res.text();
  lines = text.trim().split('\n').filter(Boolean).map((l) => JSON.parse(l));
  const types = [...new Set(lines.map((l) => l.type))];
  // Joined/available events are plumbing: keep them available, off by default.
  const noisy = new Set(['participant.joined', 'work.available', 'message_received.started', 'message_received.completed']);
  active = new Set(types.filter((t) => !noisy.has(t)));
  chips.innerHTML = types.map((t) => `<span class="chip${active.has(t) ? ' on' : ''}" data-type="${esc(t)}">${esc(t)}</span>`).join('');
  chips.querySelectorAll('.chip').forEach((chip) => {
    chip.onclick = () => {
      const t = chip.dataset.type;
      if (active.has(t)) { active.delete(t); chip.classList.remove('on'); }
      else { active.add(t); chip.classList.add('on'); }
      render();
    };
  });
  render();
  renderStats();
  renderPortfolio(id);
}

function renderStats() {
  const done = lines.find((l) => l.type === 'run.completed');
  const s = done?.data ?? null;
  if (!s) return;
  document.getElementById('s-time').textContent = (s.elapsedMs / 1000).toFixed(1) + 's';
  document.getElementById('s-calls').textContent = s.modelCalls;
  document.getElementById('s-tokens').textContent = `${s.inputTokens} / ${s.outputTokens}`;
  document.getElementById('s-cost').textContent = '$' + Number(s.costUsd).toFixed(4);
  document.getElementById('s-approved').textContent = `${s.approved}/${s.proposals}`;
}

async function renderPortfolio(id) {
  const el = document.getElementById('portfolio');
  try {
    const md = await (await fetch(`/run/${id}/portfolio.md`)).text();
    el.classList.remove('empty');
    el.innerHTML = md
      .split('\n')
      .map((line) => {
        if (line.startsWith('### ')) return `<h3>${esc(line.slice(4))}</h3>`;
        if (line.startsWith('## ')) return `<h2>${esc(line.slice(3))}</h2>`;
        if (line.startsWith('# ')) return `<h1>${esc(line.slice(2))}</h1>`;
        if (line.startsWith('- ')) return `<li>${inline(line.slice(2))}</li>`;
        if (!line.trim()) return '';
        if (line.trim() === '---') return '<hr />';
        return `<p>${inline(line)}</p>`;
      })
      .join('');
  } catch {
    el.textContent = 'no portfolio yet';
  }
}

function inline(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function render() {
  const term = search.value.trim().toLowerCase();
  const rows = lines.filter((l) => active.has(l.type))
    .filter((l) => !term || (l.summary + ' ' + l.producer + ' ' + l.type).toLowerCase().includes(term));

  if (!rows.length) { timeline.innerHTML = '<div class="empty">nothing matches</div>'; return; }

  timeline.innerHTML = rows.map((l, i) => {
    let cls = '';
    if (l.type === 'proposal.reviewed') cls = /APPROVE/i.test(l.summary) ? 'approve' : 'reject';
    if (l.type === 'task.measured') cls = 'measure';
    return `<div class="row ${cls}" data-i="${i}">
      <div class="t">${(l.t / 1000).toFixed(2)}s</div>
      <div class="actor">${esc(l.producer)}</div>
      <div class="type">${esc(l.type)}</div>
      <div class="summary">${esc(l.summary)}</div>
    </div>`;
  }).join('');

  timeline.querySelectorAll('.row').forEach((row) => {
    row.onclick = () => {
      const existing = row.nextElementSibling;
      if (existing && existing.classList.contains('json')) { existing.remove(); return; }
      const line = rows[Number(row.dataset.i)];
      const pre = document.createElement('pre');
      pre.className = 'json';
      pre.textContent = JSON.stringify(line.data ?? line, null, 2);
      row.after(pre);
    };
  });
}

search.oninput = render;
boot().catch((error) => { timeline.innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
</script>
</body>
</html>
