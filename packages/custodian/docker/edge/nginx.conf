worker_processes 1;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;

  server {
    listen 80;
    server_name _;

    # The adapter appends `deny <cidr>;` here. nginx applies `deny` to the
    # client address, so the edge-to-app hop is unaffected.
    include /etc/nginx/include/deny.conf;

    location = /checkout {
      proxy_pass http://app:80;
      proxy_set_header Host $host;
    }

    location / {
      default_type text/plain;
      return 200 "edge ok\n";
    }
  }
}
