name: custody-docker

services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${CUSTODY_EDGE_PORT:-8080}:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/include:/etc/nginx/include:ro
    depends_on:
      - app
    networks:
      - custody
  app:
    image: nginx:1.27-alpine
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - custody

networks:
  custody:
    driver: bridge
    ipam:
      config:
        - subnet: ${CUSTODY_DOCKER_SUBNET:-203.0.113.0/24}
